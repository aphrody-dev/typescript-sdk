name: Conformance Tests

on:
    push:
        branches: [main, v2-2026-07-28]
    pull_request:
    workflow_dispatch:

concurrency:
    group: conformance-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    client-conformance:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: canary
            - run: bun install --frozen-lockfile
            - run: bun run build:all
            - run: bun run test:conformance:client:all
            - run: bun run --filter @modelcontextprotocol/test-conformance test:conformance:client:skills:2026
            - run: bun run --filter @modelcontextprotocol/test-conformance test:conformance:client:2026

    server-conformance:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: canary
            - run: bun install --frozen-lockfile
            - run: bun run build:all
            - run: bun run test:conformance:server
            - run: bun run test:conformance:server:draft
            - run: bun run test:conformance:server:extensions
            - run: bun run --filter @modelcontextprotocol/test-conformance test:conformance:server:skills:2025
            - run: bun run --filter @modelcontextprotocol/test-conformance test:conformance:server:2026
