on:
    push:
        branches:
            - main
            - v2-2026-07-28
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: canary

            - run: bun install --frozen-lockfile
            - run: bun run check:all
            - run: bun run build:all
            - run: bun scripts/smoke-dist-types.mjs

    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: canary

            - run: bun install --frozen-lockfile

            # The e2e suite has its own job below; everything else runs here.
            - run: bun test packages examples test/integration test/helpers

    test-e2e:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: canary

            - run: bun install --frozen-lockfile

            - run: bun test test/e2e

    test-deno:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: canary
            - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
              with:
                  deno-version: v2.x
            - run: bun install --frozen-lockfile
            - run: bun run build:all
            - run: bun run --filter @modelcontextprotocol/test-integration test:integration:deno
